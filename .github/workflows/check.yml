name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: bash -n omi run.sh tui.sh
      - run: python -m unittest discover -s tests -q
      - run: git diff --check

  pipecat:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-pipecat.txt
            requirements-pipecat.lock
      - run: python -m pip install -r requirements-pipecat.txt -c requirements-pipecat.lock
      - run: python -B -m unittest discover -s tests -p test_pipecat_runtime.py -q
